name: tests

# Runs pytest on every push and PR so a broken ratio/DuPont formula can't
# silently merge to main. Deliberately minimal ("CI-lite") — just install
# deps and run pytest, no lint/coverage gates, to keep this a light add
# rather than another thing to maintain during a tight build window.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v
